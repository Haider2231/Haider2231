<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Supera tus límites. Aquí y ahora.</title>
  <desc id="desc">Frase de Asta (Black Clover) animada con energía roja de antimagia.</desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0B14"/>
      <stop offset="0.55" stop-color="#1A0A10"/>
      <stop offset="1" stop-color="#0D0B14"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="62%" r="55%">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FECACA"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="filo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="recorteTitulo">
      <text x="500" y="138" text-anchor="middle" class="titulo" textLength="860" lengthAdjust="spacingAndGlyphs">SUPERA TUS LÍMITES</text>
    </clipPath>
  </defs>

  <style>
    .titulo { font: 900 76px 'Arial Black', 'Segoe UI Black', Impact, 'Helvetica Neue', Arial, sans-serif; }
    .ahora  { font: 900 66px 'Arial Black', 'Segoe UI Black', Impact, 'Helvetica Neue', Arial, sans-serif; }
    .etiqueta { font: 700 14px 'Consolas', 'Courier New', monospace; letter-spacing: 6px; }
    .cita { font: italic 400 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }

    .entra   { animation: entrar 0.9s cubic-bezier(.2,.9,.3,1.2) both; }
    .entra-2 { animation: entrar 0.9s cubic-bezier(.2,.9,.3,1.2) 0.45s both; }
    .entra-3 { animation: aparecer 1.2s ease 1.1s both; }
    @keyframes entrar { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

    .pulso { animation: pulso 1.8s ease-in-out 1.4s infinite; }
    @keyframes pulso { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

    .barrido { animation: barrer 5s ease-in-out 1.6s infinite; }
    @keyframes barrer { 0% { transform: translateX(-320px); } 35%, 100% { transform: translateX(1100px); } }

    .glitch-a { animation: glitchA 4.2s steps(1) 2s infinite; opacity: 0; }
    .glitch-b { animation: glitchB 4.2s steps(1) 2s infinite; opacity: 0; }
    @keyframes glitchA {
      0%, 89%, 100% { opacity: 0; transform: none; }
      90% { opacity: .85; transform: translate(-6px, 2px); }
      93% { opacity: .85; transform: translate(4px, -2px); }
      96% { opacity: .85; transform: translate(-3px, 0); }
    }
    @keyframes glitchB {
      0%, 89%, 100% { opacity: 0; transform: none; }
      90% { opacity: .85; transform: translate(6px, -2px); }
      93% { opacity: .85; transform: translate(-4px, 2px); }
      96% { opacity: .85; transform: translate(3px, 1px); }
    }

    .corte { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: cortar 6s ease-out 2.4s infinite; }
    @keyframes cortar {
      0% { stroke-dashoffset: 1000; opacity: 1; }
      6% { stroke-dashoffset: 0; opacity: 1; }
      14%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .chispa { animation: subir 3.6s ease-in infinite; opacity: 0; }
    @keyframes subir {
      0% { opacity: 0; transform: translateY(0); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-230px); }
    }

    .parpadeo { animation: parpadear 1.1s steps(1) infinite; }
    @keyframes parpadear { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .glitch-a, .glitch-b, .chispa, .corte { display: none; }
    }
  </style>

  <!-- Fondo y aura -->
  <rect width="1000" height="300" rx="18" fill="url(#fondo)"/>
  <rect width="1000" height="300" rx="18" fill="url(#aura)" class="pulso"/>
  <rect x="1.5" y="1.5" width="997" height="297" rx="17" fill="none" stroke="#DC2626" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Chispas de antimagia -->
  <g fill="#EF4444">
    <circle cx="70"  cy="300" r="3"   class="chispa" style="animation-delay:0s"/>
    <circle cx="150" cy="300" r="2"   class="chispa" style="animation-delay:1.3s"/>
    <circle cx="230" cy="300" r="3.5" class="chispa" style="animation-delay:2.4s"/>
    <circle cx="320" cy="300" r="2"   class="chispa" style="animation-delay:0.7s"/>
    <circle cx="410" cy="300" r="2.5" class="chispa" style="animation-delay:3.1s"/>
    <circle cx="590" cy="300" r="3"   class="chispa" style="animation-delay:1.8s"/>
    <circle cx="680" cy="300" r="2"   class="chispa" style="animation-delay:0.3s"/>
    <circle cx="770" cy="300" r="3.5" class="chispa" style="animation-delay:2.9s"/>
    <circle cx="860" cy="300" r="2"   class="chispa" style="animation-delay:1s"/>
    <circle cx="940" cy="300" r="3"   class="chispa" style="animation-delay:2.1s"/>
  </g>
  <g fill="#A855F7">
    <circle cx="110" cy="300" r="2"   class="chispa" style="animation-delay:2.7s"/>
    <circle cx="500" cy="300" r="2.5" class="chispa" style="animation-delay:1.5s"/>
    <circle cx="900" cy="300" r="2"   class="chispa" style="animation-delay:0.5s"/>
  </g>

  <!-- Etiqueta superior -->
  <text x="500" y="44" text-anchor="middle" class="etiqueta entra" fill="#F87171">◆ MI MAGIA ES NO RENDIRME ◆<tspan class="parpadeo" fill="#FFFFFF"> _</tspan></text>

  <!-- SUPERA TUS LÍMITES -->
  <g class="entra">
    <text x="500" y="138" text-anchor="middle" class="titulo" textLength="860" lengthAdjust="spacingAndGlyphs" fill="url(#metal)">SUPERA TUS LÍMITES</text>
  </g>
  <g clip-path="url(#recorteTitulo)">
    <g transform="skewX(-20)">
      <rect x="0" y="60" width="160" height="100" fill="url(#brillo)" class="barrido"/>
    </g>
  </g>

  <!-- AQUÍ Y AHORA. con glitch -->
  <g class="entra-2">
    <text x="500" y="222" text-anchor="middle" class="ahora glitch-a" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#A855F7">AQUÍ Y AHORA.</text>
    <text x="500" y="222" text-anchor="middle" class="ahora glitch-b" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#6366F1">AQUÍ Y AHORA.</text>
    <text x="500" y="222" text-anchor="middle" class="ahora pulso" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#DC2626" filter="url(#neon)">AQUÍ Y AHORA.</text>
    <text x="500" y="222" text-anchor="middle" class="ahora" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#FFF1F2">AQUÍ Y AHORA.</text>
  </g>

  <!-- Corte de espada -->
  <path d="M 120 262 L 880 52" stroke="url(#filo)" stroke-width="4" stroke-linecap="round" fill="none" class="corte"/>

  <!-- Cita -->
  <text x="500" y="270" text-anchor="middle" class="cita entra-3" fill="#9CA3AF">“Surpass your limits. Right here, right now.” — Black Clover</text>
</svg>
