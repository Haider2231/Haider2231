<svg xmlns="http://www.w3.org/2000/svg" width="480" height="206" viewBox="0 0 480 206" role="img" aria-labelledby="t">
  <title id="t">Releases Cliente SSH: Flujo de publicación: compila y despliega los releases oficiales del Cliente SSH Unipiloto en GitHub.</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14111F"/>
      <stop offset="1" stop-color="#0B0A12"/>
    </linearGradient>
    <radialGradient id="aura" cx="0%" cy="0%" r="80%">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barraG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="brilloG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dentro"><path d="M 14 1.5 H 466 Q 478.5 1.5 478.5 14 V 192 Q 478.5 204.5 466 204.5 H 14 Q 1.5 204.5 1.5 192 V 14 Q 1.5 1.5 14 1.5 Z"/></clipPath>
  </defs>
  <style>
    .mision { font: 700 11px 'Consolas', 'Courier New', monospace; letter-spacing: 3px; }
    .nombre { font: 900 23px 'Arial Black', 'Segoe UI Black', Impact, 'Helvetica Neue', Arial, sans-serif; }
    .texto { font: 400 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .chip { font: 700 10px 'Consolas', 'Courier New', monospace; letter-spacing: 1px; }
    .pastilla-texto { font: 600 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .runa { font: 400 20px 'Segoe UI Symbol', 'Noto Sans Runic', serif; animation: runa 3s ease-in-out infinite; opacity: 0.1; }
    @keyframes runa { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.45; } }

    .entra { animation: entrar 0.7s cubic-bezier(.2,.9,.3,1.2) both; }
    @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .pastilla { animation: entrar 0.5s ease-out both; }
    .luz { stroke-dasharray: 120 1372; animation: recorrer 5s linear infinite; }
    @keyframes recorrer { to { stroke-dashoffset: -1492; } }
    .barra { animation: barra 2.2s ease-in-out infinite; }
    @keyframes barra { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .brillo { animation: barrer 6s ease-in-out 1s infinite; }
    @keyframes barrer { 0% { transform: translateX(-200px); } 30%, 100% { transform: translateX(700px); } }
    .gira { animation: girar 20s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes girar { to { transform: rotate(360deg); } }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .solo-animado { display: none; }
    }</style>

  <path d="M 14 1.5 H 466 Q 478.5 1.5 478.5 14 V 192 Q 478.5 204.5 466 204.5 H 14 Q 1.5 204.5 1.5 192 V 14 Q 1.5 1.5 14 1.5 Z" fill="url(#fondo)"/>
  <path d="M 14 1.5 H 466 Q 478.5 1.5 478.5 14 V 192 Q 478.5 204.5 466 204.5 H 14 Q 1.5 204.5 1.5 192 V 14 Q 1.5 1.5 14 1.5 Z" fill="url(#aura)"/>
  <g clip-path="url(#dentro)">
    <g fill="#A855F7"><text x="398" y="128" class="runa" style="animation-delay:0.00s">ᚠ</text><text x="422" y="128" class="runa" style="animation-delay:0.35s">ᚱ</text><text x="446" y="128" class="runa" style="animation-delay:0.70s">ᚦ</text><text x="398" y="156" class="runa" style="animation-delay:1.05s">ᚨ</text><text x="422" y="156" class="runa" style="animation-delay:1.40s">ᛁ</text><text x="446" y="156" class="runa" style="animation-delay:1.75s">ᛟ</text></g>
    <g transform="skewX(-20)"><rect x="0" y="0" width="140" height="206" fill="url(#brilloG)" class="brillo solo-animado"/></g>
  </g>
  <rect x="14" y="22" width="4" height="162" rx="2" fill="url(#barraG)" filter="url(#neon)" class="barra"/>
  <path d="M 14 1.5 H 466 Q 478.5 1.5 478.5 14 V 192 Q 478.5 204.5 466 204.5 H 14 Q 1.5 204.5 1.5 192 V 14 Q 1.5 1.5 14 1.5 Z" fill="none" stroke="#A855F7" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M 14 1.5 H 466 Q 478.5 1.5 478.5 14 V 192 Q 478.5 204.5 466 204.5 H 14 Q 1.5 204.5 1.5 192 V 14 Q 1.5 1.5 14 1.5 Z" fill="none" stroke="#A855F7" stroke-width="2.5" class="luz solo-animado" filter="url(#neon)"/>

  <g class="entra">
    <text x="34" y="34" class="mision" fill="#A855F7">MISIÓN II-04</text>
    <rect x="384.2" y="18" width="73.8" height="22" rx="11" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.6"/><text x="421.1" y="33" text-anchor="middle" class="chip" fill="#A855F7">PÚBLICO</text>
    <text x="34" y="74" class="nombre" fill="#F9FAFB">Releases Cliente SSH</text>
    <line x1="34" y1="86" x2="446" y2="86" stroke="#A855F7" stroke-opacity="0.25"/>
    <text x="34" y="108" class="texto" fill="#CBD5E1">Flujo de publicación: compila y despliega los releases</text><text x="34" y="128" class="texto" fill="#CBD5E1">oficiales del Cliente SSH Unipiloto en GitHub.</text>
  </g>
  <g class="pastilla" style="animation-delay:0.50s"><rect x="34.0" y="166" width="100.0" height="24" rx="6" fill="#0B0A12" stroke="#A855F7" stroke-opacity="0.45"/><circle cx="45.0" cy="178" r="3" fill="#A855F7"/><text x="53.0" y="182.5" class="pastilla-texto" fill="#E5E7EB">PowerShell</text></g><g class="pastilla" style="animation-delay:0.62s"><rect x="142.0" y="166" width="54.4" height="24" rx="6" fill="#0B0A12" stroke="#A855F7" stroke-opacity="0.45"/><circle cx="153.0" cy="178" r="3" fill="#A855F7"/><text x="161.0" y="182.5" class="pastilla-texto" fill="#E5E7EB">Bash</text></g><g class="pastilla" style="animation-delay:0.74s"><rect x="204.4" y="166" width="69.6" height="24" rx="6" fill="#0B0A12" stroke="#A855F7" stroke-opacity="0.45"/><circle cx="215.4" cy="178" r="3" fill="#A855F7"/><text x="223.4" y="182.5" class="pastilla-texto" fill="#E5E7EB">GitHub</text></g>
</svg>
