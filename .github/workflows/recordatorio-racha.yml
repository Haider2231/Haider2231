name: Recordatorio de racha

on:
  schedule:
    - cron: "0 0 * * *" # 7:00 p. m. hora de Colombia
    - cron: "30 3 * * *" # 10:30 p. m. hora de Colombia
  workflow_dispatch:
    inputs:
      probar:
        description: "Enviar el aviso aunque ya haya contribuciones hoy"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contar las contribuciones de hoy
        id: hoy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
        run: |
          fecha=$(TZ=America/Bogota date +%F)
          total=$(gh api graphql \
            -f query='query($u: String!) { user(login: $u) { contributionsCollection { contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }' \
            -f u="$USUARIO" \
            --jq "[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | select(.date == \"$fecha\")][0].contributionCount // 0")
          echo "fecha=$fecha" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Contribuciones del $fecha: **$total**" >> "$GITHUB_STEP_SUMMARY"

      - name: Avisar por WhatsApp
        if: steps.hoy.outputs.total == '0' || inputs.probar == true
        env:
          TELEFONO: ${{ secrets.CALLMEBOT_PHONE }}
          APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FECHA: ${{ steps.hoy.outputs.fecha }}
        run: |
          if [ -z "$TELEFONO" ] || [ -z "$APIKEY" ]; then
            echo "WhatsApp sin configurar: faltan los secretos CALLMEBOT_PHONE y CALLMEBOT_APIKEY." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          texto="Haider, hoy ($FECHA) todavía no tienes contribuciones en GitHub. Haz un commit antes de medianoche para no perder la racha. Supera tus límites, aquí y ahora."
          curl -sS --fail --get "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$TELEFONO" \
            --data-urlencode "text=$texto" \
            --data-urlencode "apikey=$APIKEY" > /dev/null
          echo "Aviso enviado por WhatsApp." >> "$GITHUB_STEP_SUMMARY"

      # Al fallar, GitHub manda un correo de "Run failed" a la cuenta dueña del flujo
      - name: Avisar por correo
        if: steps.hoy.outputs.total == '0' || inputs.probar == true
        run: |
          echo "::error::Hoy (${{ steps.hoy.outputs.fecha }}) todavía no tienes contribuciones. Haz un commit antes de medianoche para no perder la racha."
          exit 1
