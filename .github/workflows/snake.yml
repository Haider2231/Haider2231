name: Generar serpiente

on:
  schedule:
    - cron: "0 5 * * *" # todos los días a medianoche (hora de Colombia)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7C3AED
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161B22,#2E1065,#5B21B6,#7C3AED,#A855F7

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
